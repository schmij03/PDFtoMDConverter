<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF → Markdown Konverter</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --success: #3fb950;
      --error-bg: rgba(248,81,73,.12);
      --error-border: rgba(248,81,73,.4);
      --error-text: #f85149;
      --code-bg: #1f2428;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
    }
    .header-inner { max-width: 860px; margin: 0 auto; padding: 0 24px; }
    .header h1 {
      font-size: 1.6rem; font-weight: 700; color: #f0f6fc; letter-spacing: -.5px;
    }
    .header p { color: var(--text-muted); margin-top: 3px; font-size: .9rem; }

    /* ── Main layout ── */
    .main {
      max-width: 860px; margin: 0 auto; padding: 28px 24px;
      width: 100%; flex: 1;
      display: flex; flex-direction: column; gap: 14px;
    }

    /* ── Card / section ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
    }
    .card label {
      display: block; font-weight: 600; font-size: .875rem;
      color: var(--text); margin-bottom: 8px;
    }

    /* ── Config row ── */
    .config-grid {
      display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: end;
    }
    @media (max-width: 600px) { .config-grid { grid-template-columns: 1fr; } }
    .config-group { display: flex; flex-direction: column; gap: 6px; }
    .config-group label { font-size: .82rem; color: var(--text-muted); font-weight: 500; }

    input[type="password"], input[type="text"], select {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 12px; color: var(--text);
      font-size: .875rem; width: 100%; transition: border-color .2s;
    }
    input[type="password"]:focus, input[type="text"]:focus, select:focus {
      outline: none; border-color: var(--accent);
    }
    input.mono { font-family: 'SFMono-Regular', Consolas, monospace; }
    select { cursor: pointer; }
    select option { background: var(--surface2); }

    .api-row { display: flex; gap: 8px; }
    .api-row input { flex: 1; }
    .btn-icon {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 12px; cursor: pointer;
      color: var(--text-muted); font-size: .95rem; transition: background .2s;
      white-space: nowrap;
    }
    .btn-icon:hover { background: var(--border); color: var(--text); }
    .hint { font-size: .76rem; color: var(--text-muted); margin-top: 7px; }

    /* ── Dropzone ── */
    .dropzone {
      background: var(--surface); border: 2px dashed var(--border);
      border-radius: 8px; padding: 44px 24px; text-align: center;
      cursor: pointer; transition: all .2s; user-select: none;
    }
    .dropzone:hover, .dropzone.dragging {
      border-color: var(--accent); background: rgba(88,166,255,.05);
    }
    .dropzone.has-file {
      border-style: solid; border-color: var(--success);
      background: rgba(63,185,80,.05); cursor: default;
    }
    .drop-icon { font-size: 2.4rem; display: block; margin-bottom: 10px; }
    .drop-prompt p { font-size: .95rem; }
    .drop-prompt small { color: var(--text-muted); font-size: .78rem; margin-top: 4px; display: block; }
    .file-info { display: flex; align-items: center; justify-content: center; gap: 16px; }
    .file-name { font-weight: 600; }
    .file-size { color: var(--text-muted); font-size: .82rem; margin-top: 2px; }
    .file-change {
      background: none; border: 1px solid var(--border); border-radius: 4px;
      padding: 4px 10px; font-size: .78rem; color: var(--text-muted);
      cursor: pointer; margin-top: 4px;
    }
    .file-change:hover { background: var(--surface2); }

    /* ── Buttons ── */
    .actions { display: flex; gap: 10px; }
    .btn-primary {
      flex: 1; background: var(--accent); color: #0d1117;
      border: none; border-radius: 6px; padding: 12px 24px;
      font-size: .95rem; font-weight: 700; cursor: pointer; transition: background .2s;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-secondary {
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 12px 18px; font-size: .875rem; cursor: pointer; transition: background .2s;
    }
    .btn-secondary:hover { background: var(--border); }

    /* ── Loading ── */
    .loading-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 18px 20px;
    }
    .progress-bar {
      height: 3px; background: var(--surface2); border-radius: 2px;
      overflow: hidden; margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%; background: var(--accent); border-radius: 2px;
      transition: width .35s ease;
    }
    .loading-step {
      display: flex; align-items: center; gap: 10px;
      font-size: .85rem; color: var(--text-muted);
    }
    .spinner {
      display: inline-block; width: 15px; height: 15px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .75s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    .error-card {
      background: var(--error-bg); border: 1px solid var(--error-border);
      border-radius: 8px; padding: 14px 18px;
      display: flex; align-items: flex-start; gap: 10px;
      font-size: .875rem; color: var(--error-text);
    }

    /* ── Results ── */
    .results-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
    }
    .tabs {
      display: flex; border-bottom: 1px solid var(--border);
      background: var(--surface2); overflow-x: auto;
    }
    .tab {
      padding: 11px 20px; background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--text-muted); cursor: pointer; font-size: .875rem;
      transition: all .2s; margin-bottom: -1px; white-space: nowrap;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { padding: 22px; max-height: 640px; overflow-y: auto; }

    /* ── Markdown preview ── */
    .md-preview { line-height: 1.75; font-size: .9rem; color: var(--text); }
    .md-preview h1, .md-preview h2, .md-preview h3,
    .md-preview h4, .md-preview h5 {
      color: #f0f6fc; margin: 1.4em 0 .5em; line-height: 1.3;
    }
    .md-preview h1 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    .md-preview h2 { font-size: 1.2em; }
    .md-preview h3 { font-size: 1.05em; }
    .md-preview p { margin: .75em 0; }
    .md-preview ul, .md-preview ol { margin: .75em 0; padding-left: 2em; }
    .md-preview li { margin: .3em 0; }
    .md-preview code {
      background: var(--code-bg); padding: .12em .4em;
      border-radius: 3px; font-size: .82em;
      font-family: 'SFMono-Regular', Consolas, monospace;
    }
    .md-preview pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 14px; overflow-x: auto; margin: 1em 0;
    }
    .md-preview pre code { background: none; padding: 0; font-size: .83em; }
    .md-preview table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: .87em; }
    .md-preview th, .md-preview td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; }
    .md-preview th { background: var(--surface2); font-weight: 600; }
    .md-preview tr:nth-child(even) { background: rgba(255,255,255,.02); }
    .md-preview blockquote {
      border-left: 3px solid var(--accent); padding-left: 16px;
      margin: 1em 0; color: var(--text-muted);
    }
    .md-preview img { max-width: 100%; border-radius: 4px; margin: .8em 0; }
    .md-preview a { color: var(--accent); }
    .md-preview hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }

    /* ── Raw ── */
    .raw-md {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: .78rem; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word; color: var(--text);
    }
    .streaming-wrap { display: flex; flex-direction: column; gap: 12px; }
    .streaming-label { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--text-muted); }

    /* ── Figures ── */
    .figures-wrap { display: flex; flex-direction: column; gap: 18px; }
    .figures-notice {
      background: rgba(88,166,255,.08); border: 1px solid rgba(88,166,255,.25);
      border-radius: 6px; padding: 14px 16px; font-size: .83rem;
      color: var(--text-muted); line-height: 1.9;
    }
    .figures-notice code {
      background: var(--code-bg); padding: 1px 6px; border-radius: 3px;
      font-size: .8rem; color: var(--accent); font-family: monospace;
    }
    .figures-empty { color: var(--text-muted); font-size: .875rem; text-align: center; padding: 32px 0; }
    .figures-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px;
    }
    .figure-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden;
    }
    .figure-img-wrap {
      background: #000; padding: 6px;
      aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .figure-img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .figure-footer {
      padding: 9px 12px; display: flex; align-items: center;
      justify-content: space-between; gap: 6px;
    }
    .figure-name {
      font-size: .75rem; color: var(--text-muted); font-family: monospace;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .btn-dl-sm {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; padding: 3px 9px; font-size: .75rem;
      color: var(--text); cursor: pointer; flex-shrink: 0;
    }
    .btn-dl-sm:hover { background: var(--border); }

    /* ── Download bar ── */
    .download-bar {
      padding: 14px 22px; border-top: 1px solid var(--border);
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .btn-dl-main {
      background: var(--success); color: #0d1117; border: none;
      border-radius: 6px; padding: 9px 18px; font-size: .875rem;
      font-weight: 600; cursor: pointer; transition: opacity .2s;
    }
    .btn-dl-main:hover { opacity: .84; }

    /* ── Footer ── */
    .footer {
      text-align: center; padding: 22px; color: var(--text-muted);
      font-size: .75rem; border-top: 1px solid var(--border); margin-top: auto;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useCallback, useMemo, useEffect } = React;

    /* ─── pdf.js worker ─── */
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    /* ─── Helpers ─── */
    const renderPageToPNG = async (page, scale = 1.5) => {
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      return canvas.toDataURL('image/png');
    };

    const SYSTEM_PROMPT = (n) =>
`Du bist ein Experte für die Konvertierung wissenschaftlicher PDF-Dokumente in strukturiertes Markdown.

Ich liefere dir ${n} Seitenbilder. Die Seiten sind als page-1.png bis page-${n}.png gespeichert.

Erstelle folgende Ausgabe – NUR Markdown, keine Erklärungen davor oder danach:

1. YAML-Frontmatter:
---
title: "Vollständiger Titel des Dokuments"
authors:
  - "Erster Autor"
  - "Zweiter Autor"
year: 2024
publisher: "Verlag, Journal oder Konferenzname"
doi: "10.xxxx/xxxxx"
---

2. Zu Beginn jeder Seite einen Seitenmarker:
<!-- page: N -->

3. Abbildungen, Grafiken, Diagramme als Markdown-Bilder:
![Figure X: Kurze Beschreibung (Seite P)](figures/page-P.png)
   – X = fortlaufende Abbildungsnummer, P = Seitennummer der Abbildung.

4. Vollständiger Text mit korrekter Markdown-Formatierung:
   - Überschriften: #, ##, ###
   - Listen und Aufzählungen
   - Fett **text** und kursiv *text*
   - Mathe-Formeln in LaTeX: $inline$ und $$block$$
   - Tabellen im Markdown-Format
   - Fußnoten: [^1]

Gib ausschließlich den Markdown-Text zurück.`;

    const downloadBlob = (content, filename, mime) => {
      const url = URL.createObjectURL(new Blob([content], { type: mime }));
      const a = Object.assign(document.createElement('a'), { href: url, download: filename });
      a.click();
      URL.revokeObjectURL(url);
    };

    const downloadDataUrl = (dataUrl, filename) => {
      Object.assign(document.createElement('a'), { href: dataUrl, download: filename }).click();
    };

    /* ─── App ─── */
    const App = () => {
      const [apiKey, setApiKey]         = useState(() => localStorage.getItem('claude_api_key') || '');
      const [showKey, setShowKey]       = useState(false);
      const [model, setModel]           = useState('claude-opus-4-8');
      const [maxPages, setMaxPages]     = useState(30);
      const [file, setFile]             = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const [loading, setLoading]       = useState(false);
      const [step, setStep]             = useState('');
      const [progress, setProgress]     = useState(0);
      const [error, setError]           = useState('');
      const [markdown, setMarkdown]     = useState('');
      const [isStreaming, setIsStreaming] = useState(false);
      const [pageImages, setPageImages] = useState([]);  // dataUrl per page (0-indexed)
      const [activeTab, setActiveTab]   = useState('preview');
      const fileInputRef = useRef(null);
      const abortRef     = useRef(null);

      /* Figures = pages referenced in markdown via figures/page-N.png */
      const figures = useMemo(() => {
        if (pageImages.length === 0) return [];
        const refs = new Set();
        const re = /figures\/page-(\d+)\.png/g;
        let m;
        while ((m = re.exec(markdown)) !== null) refs.add(parseInt(m[1]));
        const source = pageImages.map((d, i) => ({ name: `page-${i + 1}.png`, pageNum: i + 1, dataUrl: d }));
        return refs.size > 0 ? source.filter(f => refs.has(f.pageNum)) : source;
      }, [markdown, pageImages]);

      const storeKey = (k) => { setApiKey(k); localStorage.setItem('claude_api_key', k); };

      const acceptFile = (f) => {
        if (!f) return;
        if (f.type !== 'application/pdf') { setError('Bitte nur PDF-Dateien auswählen.'); return; }
        setFile(f); setMarkdown(''); setPageImages([]); setError('');
      };

      const handleDrop = useCallback((e) => {
        e.preventDefault(); setIsDragging(false);
        acceptFile(e.dataTransfer.files[0]);
      }, []);

      const convert = async () => {
        if (!apiKey.trim()) { setError('Bitte API-Schlüssel eingeben.'); return; }
        if (!file)          { setError('Bitte eine PDF-Datei auswählen.'); return; }

        setLoading(true); setError(''); setMarkdown(''); setPageImages([]); setProgress(0);
        const ctrl = new AbortController();
        abortRef.current = ctrl;

        try {
          /* 1 – Load PDF */
          setStep('PDF wird geladen…');
          const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
          const total = pdf.numPages;
          const limit = Math.min(total, maxPages);

          /* 2 – Render pages */
          const images = [];
          for (let i = 1; i <= limit; i++) {
            setStep(`Seite ${i} von ${limit} wird gerendert…`);
            setProgress(Math.round((i / limit) * 38));
            images.push(await renderPageToPNG(await pdf.getPage(i)));
          }
          setPageImages(images);

          if (total > limit) {
            setStep(`Hinweis: Nur die ersten ${limit} von ${total} Seiten werden verarbeitet.`);
            await new Promise(r => setTimeout(r, 1200));
          }

          /* 3 – Build message */
          setStep('Anfrage wird zusammengestellt…');
          setProgress(42);

          const userContent = [];
          images.forEach((dataUrl, idx) => {
            userContent.push({ type: 'text', text: `Seite ${idx + 1}:` });
            userContent.push({
              type: 'image',
              source: { type: 'base64', media_type: 'image/png', data: dataUrl.split(',')[1] }
            });
          });
          userContent.push({ type: 'text', text: 'Bitte konvertiere dieses Dokument jetzt vollständig in Markdown.' });

          /* 4 – Stream API call */
          setStep('Claude analysiert das Dokument… (kann einige Minuten dauern)');
          setIsStreaming(true);
          setActiveTab('raw');
          setProgress(46);

          const resp = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey.trim(),
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
              model,
              max_tokens: 16000,
              stream: true,
              system: SYSTEM_PROMPT(limit),
              messages: [{ role: 'user', content: userContent }]
            }),
            signal: ctrl.signal
          });

          if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.error?.message || `HTTP ${resp.status}: ${resp.statusText}`);
          }

          /* 5 – Read stream */
          const reader  = resp.body.getReader();
          const decoder = new TextDecoder();
          let fullText = '', buf = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const lines = buf.split('\n');
            buf = lines.pop() ?? '';
            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              const raw = line.slice(6).trim();
              if (!raw || raw === '[DONE]') continue;
              try {
                const ev = JSON.parse(raw);
                if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
                  fullText += ev.delta.text;
                  setMarkdown(fullText);
                  setProgress(46 + Math.min(50, Math.round((fullText.length / 12000) * 50)));
                }
              } catch (_) {}
            }
          }

          setProgress(100);
          setIsStreaming(false);
          setActiveTab('preview');
          setStep('');

        } catch (err) {
          if (err.name === 'AbortError') {
            setError('Konvertierung abgebrochen.');
          } else {
            setError(`Fehler: ${err.message}`);
          }
          setIsStreaming(false);
          setStep('');
        } finally {
          setLoading(false);
          abortRef.current = null;
        }
      };

      /* Rendered preview – only after stream ends */
      const previewHtml = useMemo(() => {
        if (!markdown || isStreaming) return null;
        try { return window.marked.parse(markdown); }
        catch (_) { return `<pre>${markdown}</pre>`; }
      }, [markdown, isStreaming]);

      const basename = (file?.name || 'dokument').replace(/\.pdf$/i, '');

      return (
        <div className="app">
          <header className="header">
            <div className="header-inner">
              <h1>PDF → Markdown</h1>
              <p>Wissenschaftliche PDFs mit Claude AI vollständig konvertieren</p>
            </div>
          </header>

          <main className="main">

            {/* ── Config card ── */}
            <div className="card">
              <label>Einstellungen</label>
              <div className="config-grid">
                <div className="config-group">
                  <label>Claude API-Schlüssel</label>
                  <div className="api-row">
                    <input
                      className="mono"
                      type={showKey ? 'text' : 'password'}
                      placeholder="sk-ant-api03-…"
                      value={apiKey}
                      onChange={e => storeKey(e.target.value)}
                    />
                    <button className="btn-icon" onClick={() => setShowKey(v => !v)} title="Anzeigen / Verbergen">
                      {showKey ? '🙈' : '👁️'}
                    </button>
                  </div>
                </div>
                <div className="config-group">
                  <label>Modell</label>
                  <select value={model} onChange={e => setModel(e.target.value)}>
                    <option value="claude-opus-4-8">Opus 4 (beste Qualität)</option>
                    <option value="claude-sonnet-4-6">Sonnet 4 (ausgewogen)</option>
                    <option value="claude-haiku-4-5-20251001">Haiku 4 (schnell)</option>
                  </select>
                </div>
                <div className="config-group">
                  <label>Max. Seiten</label>
                  <select value={maxPages} onChange={e => setMaxPages(Number(e.target.value))}>
                    <option value={10}>10 Seiten</option>
                    <option value={20}>20 Seiten</option>
                    <option value={30}>30 Seiten</option>
                    <option value={50}>50 Seiten</option>
                  </select>
                </div>
              </div>
              <p className="hint">Der API-Schlüssel wird ausschließlich lokal im Browser gespeichert.</p>
            </div>

            {/* ── Dropzone ── */}
            <div
              className={`dropzone${isDragging ? ' dragging' : ''}${file ? ' has-file' : ''}`}
              onDragOver={e => { e.preventDefault(); setIsDragging(true); }}
              onDragLeave={() => setIsDragging(false)}
              onDrop={handleDrop}
              onClick={() => !loading && fileInputRef.current?.click()}
              role="button" tabIndex={0}
              onKeyDown={e => e.key === 'Enter' && fileInputRef.current?.click()}
            >
              <input ref={fileInputRef} type="file" accept=".pdf,application/pdf"
                onChange={e => acceptFile(e.target.files[0])} hidden />
              {file ? (
                <div className="file-info">
                  <span style={{ fontSize: '2rem' }}>📄</span>
                  <div>
                    <p className="file-name">{file.name}</p>
                    <p className="file-size">{(file.size / 1024 / 1024).toFixed(2)} MB</p>
                    <button className="file-change" onClick={e => { e.stopPropagation(); fileInputRef.current?.click(); }}>
                      Andere Datei wählen
                    </button>
                  </div>
                </div>
              ) : (
                <div className="drop-prompt">
                  <span className="drop-icon">📂</span>
                  <p>PDF hier ablegen oder klicken zum Auswählen</p>
                  <small>Unterstützt PDFs bis zu {maxPages} Seiten</small>
                </div>
              )}
            </div>

            {/* ── Actions ── */}
            <div className="actions">
              <button className="btn-primary" onClick={convert}
                disabled={loading || !file || !apiKey.trim()}>
                {loading ? 'Wird konvertiert…' : 'In Markdown konvertieren'}
              </button>
              {loading && (
                <button className="btn-secondary" onClick={() => abortRef.current?.abort()}>
                  Abbrechen
                </button>
              )}
            </div>

            {/* ── Loading ── */}
            {loading && step && (
              <div className="loading-card">
                <div className="progress-bar">
                  <div className="progress-fill" style={{ width: `${progress}%` }} />
                </div>
                <div className="loading-step">
                  <span className="spinner" />
                  <span>{step}</span>
                </div>
              </div>
            )}

            {/* ── Error ── */}
            {error && (
              <div className="error-card">
                <span>⚠️</span>
                <span>{error}</span>
              </div>
            )}

            {/* ── Results ── */}
            {(markdown || isStreaming) && (
              <div className="results-section">
                <div className="tabs">
                  {[
                    { id: 'preview',  label: 'Vorschau' },
                    { id: 'raw',      label: 'Rohtext' },
                    { id: 'figures',  label: `Abbildungen (${figures.length})` },
                  ].map(({ id, label }) => (
                    <button key={id} className={`tab${activeTab === id ? ' active' : ''}`}
                      onClick={() => setActiveTab(id)}>
                      {label}
                    </button>
                  ))}
                </div>

                <div className="tab-content">

                  {activeTab === 'preview' && (
                    isStreaming
                      ? (
                        <div className="streaming-wrap">
                          <div className="streaming-label">
                            <span className="spinner" />
                            <span>Markdown wird generiert…</span>
                          </div>
                          <pre className="raw-md" style={{ maxHeight: 400, overflowY: 'auto', opacity: .7 }}>
                            {markdown}
                          </pre>
                        </div>
                      ) : (
                        <div className="md-preview"
                          dangerouslySetInnerHTML={{ __html: previewHtml || '' }} />
                      )
                  )}

                  {activeTab === 'raw' && (
                    <pre className="raw-md">{markdown}</pre>
                  )}

                  {activeTab === 'figures' && (
                    <div className="figures-wrap">
                      <div className="figures-notice">
                        💡 <strong>Hinweis:</strong> Lege die heruntergeladenen Abbildungen in einen{' '}
                        <code>figures/</code>-Unterordner <em>neben</em> der Markdown-Datei ab:
                        <br />
                        <code>{basename}.md</code>
                        <br />
                        <code>figures/page-1.png</code>
                        <br />
                        <code>figures/page-2.png</code>&nbsp;…
                      </div>
                      {figures.length === 0 ? (
                        <p className="figures-empty">
                          {isStreaming
                            ? 'Abbildungen werden nach Abschluss der Konvertierung angezeigt.'
                            : 'Keine referenzierten Abbildungen gefunden.'}
                        </p>
                      ) : (
                        <div className="figures-grid">
                          {figures.map(fig => (
                            <div key={fig.name} className="figure-card">
                              <div className="figure-img-wrap">
                                <img src={fig.dataUrl} alt={fig.name} loading="lazy" />
                              </div>
                              <div className="figure-footer">
                                <span className="figure-name">{fig.name}</span>
                                <button className="btn-dl-sm"
                                  onClick={() => downloadDataUrl(fig.dataUrl, fig.name)}>
                                  ↓ DL
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                </div>

                {!isStreaming && markdown && (
                  <div className="download-bar">
                    <button className="btn-dl-main"
                      onClick={() => downloadBlob(markdown, `${basename}.md`, 'text/markdown;charset=utf-8')}>
                      ↓ Markdown herunterladen (.md)
                    </button>
                    {figures.length > 0 && (
                      <button className="btn-dl-main"
                        onClick={() => figures.forEach(f => downloadDataUrl(f.dataUrl, f.name))}>
                        ↓ Alle Abbildungen ({figures.length}) herunterladen
                      </button>
                    )}
                  </div>
                )}
              </div>
            )}

          </main>

          <footer className="footer">
            Konvertierung via Claude API &nbsp;·&nbsp; Alle Seiten werden lokal im Browser gerendert &nbsp;·&nbsp;
            API-Schlüssel verlässt den Browser nur als Request-Header an api.anthropic.com
          </footer>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
