<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF → Markdown Konverter</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg:            #0d1117;
      --surface:       #161b22;
      --surface2:      #21262d;
      --border:        #30363d;
      --text:          #c9d1d9;
      --text-muted:    #8b949e;
      --accent:        #58a6ff;
      --accent-hover:  #79b8ff;
      --success:       #3fb950;
      --error-bg:      rgba(248,81,73,.12);
      --error-border:  rgba(248,81,73,.4);
      --error-text:    #f85149;
      --code-bg:       #1f2428;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
    }
    .app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Header ── */
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 0; }
    .header-inner { max-width: 860px; margin: 0 auto; padding: 0 24px; }
    .header h1 { font-size: 1.6rem; font-weight: 700; color: #f0f6fc; letter-spacing: -.5px; }
    .header p  { color: var(--text-muted); margin-top: 3px; font-size: .875rem; }

    /* ── Main ── */
    .main {
      max-width: 860px; margin: 0 auto; padding: 28px 24px 100px;
      width: 100%; flex: 1; display: flex; flex-direction: column; gap: 14px;
    }

    /* ── Card ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; }
    .card > label { display: block; font-weight: 600; font-size: .875rem; margin-bottom: 10px; }

    /* ── Config ── */
    .config-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .config-group { display: flex; flex-direction: column; gap: 5px; }
    .config-group label { font-size: .8rem; color: var(--text-muted); }
    select {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 10px; color: var(--text); font-size: .875rem;
      cursor: pointer; min-width: 140px;
    }
    select:focus { outline: none; border-color: var(--accent); }
    select option { background: var(--surface2); }
    .hint { font-size: .76rem; color: var(--text-muted); margin-top: 8px; }

    /* ── Dropzone ── */
    .dropzone {
      background: var(--surface); border: 2px dashed var(--border); border-radius: 8px;
      padding: 44px 24px; text-align: center; cursor: pointer;
      transition: all .2s; user-select: none;
    }
    .dropzone:hover, .dropzone.dragging { border-color: var(--accent); background: rgba(88,166,255,.05); }
    .dropzone.has-file { border-style: solid; border-color: var(--success); background: rgba(63,185,80,.05); }
    .drop-icon { font-size: 2.4rem; display: block; margin-bottom: 10px; }
    .drop-prompt p    { font-size: .95rem; }
    .drop-prompt small { color: var(--text-muted); font-size: .78rem; margin-top: 4px; display: block; }
    .file-info { display: flex; align-items: center; justify-content: center; gap: 16px; }
    .file-name { font-weight: 600; }
    .file-size { color: var(--text-muted); font-size: .82rem; margin-top: 2px; }
    .file-change {
      background: none; border: 1px solid var(--border); border-radius: 4px;
      padding: 3px 10px; font-size: .78rem; color: var(--text-muted);
      cursor: pointer; margin-top: 6px; display: inline-block;
    }
    .file-change:hover { background: var(--surface2); }

    /* ── Buttons ── */
    .actions { display: flex; gap: 10px; }
    .btn-primary {
      flex: 1; background: var(--accent); color: #0d1117; border: none;
      border-radius: 6px; padding: 12px 24px; font-size: .95rem;
      font-weight: 700; cursor: pointer; transition: background .2s;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-secondary {
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px 18px; font-size: .875rem; cursor: pointer;
    }
    .btn-secondary:hover { background: var(--border); }

    /* ── Error ── */
    .error-card {
      background: var(--error-bg); border: 1px solid var(--error-border);
      border-radius: 8px; padding: 14px 18px; display: flex;
      align-items: flex-start; gap: 10px; font-size: .875rem; color: var(--error-text);
    }

    /* ── Results ── */
    .results-section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface2); overflow-x: auto; }
    .tab {
      padding: 11px 20px; background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--text-muted); cursor: pointer; font-size: .875rem;
      transition: all .2s; margin-bottom: -1px; white-space: nowrap;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { padding: 22px; max-height: 640px; overflow-y: auto; }

    /* ── Markdown preview ── */
    .md-preview { line-height: 1.75; font-size: .9rem; }
    .md-preview h1, .md-preview h2, .md-preview h3, .md-preview h4 {
      color: #f0f6fc; margin: 1.4em 0 .5em; line-height: 1.3;
    }
    .md-preview h1 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    .md-preview h2 { font-size: 1.2em; }
    .md-preview h3 { font-size: 1.05em; }
    .md-preview p  { margin: .75em 0; }
    .md-preview ul, .md-preview ol { margin: .75em 0; padding-left: 2em; }
    .md-preview li { margin: .3em 0; }
    .md-preview code {
      background: var(--code-bg); padding: .12em .4em; border-radius: 3px;
      font-size: .82em; font-family: 'SFMono-Regular', Consolas, monospace;
    }
    .md-preview pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 14px; overflow-x: auto; margin: 1em 0;
    }
    .md-preview pre code { background: none; padding: 0; font-size: .83em; }
    .md-preview table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: .87em; }
    .md-preview th, .md-preview td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; }
    .md-preview th { background: var(--surface2); font-weight: 600; }
    .md-preview tr:nth-child(even) { background: rgba(255,255,255,.02); }
    .md-preview blockquote { border-left: 3px solid var(--accent); padding-left: 16px; margin: 1em 0; color: var(--text-muted); }
    .md-preview img { max-width: 100%; border-radius: 4px; margin: .8em 0; }
    .md-preview a { color: var(--accent); }
    .md-preview hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }

    /* ── Raw tab ── */
    .raw-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .raw-header-label { font-size: .78rem; color: var(--text-muted); }
    .btn-copy {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; padding: 4px 12px; font-size: .78rem;
      color: var(--text-muted); cursor: pointer; transition: all .2s;
    }
    .btn-copy:hover { background: var(--border); color: var(--text); }
    .btn-copy.copied { color: var(--success); border-color: var(--success); }
    .raw-md {
      font-family: 'SFMono-Regular', Consolas, monospace; font-size: .78rem;
      line-height: 1.65; white-space: pre-wrap; word-break: break-word;
    }

    /* ── Figures ── */
    .figures-wrap { display: flex; flex-direction: column; gap: 18px; }
    .figures-notice {
      background: rgba(88,166,255,.08); border: 1px solid rgba(88,166,255,.25);
      border-radius: 6px; padding: 14px 16px; font-size: .83rem;
      color: var(--text-muted); line-height: 1.9;
    }
    .figures-notice code {
      background: var(--code-bg); padding: 1px 6px; border-radius: 3px;
      font-size: .8rem; color: var(--accent); font-family: monospace;
    }
    .figures-empty { color: var(--text-muted); font-size: .875rem; text-align: center; padding: 32px 0; }
    .figures-grid  { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    .figure-card   { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .figure-img-wrap {
      background: #000; padding: 6px; aspect-ratio: 3/4;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .figure-img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .figure-footer { padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .figure-name  { font-size: .75rem; color: var(--text-muted); font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-dl-sm {
      background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
      padding: 3px 9px; font-size: .75rem; color: var(--text); cursor: pointer; flex-shrink: 0;
    }
    .btn-dl-sm:hover { background: var(--border); }

    /* ── Download bar ── */
    .download-bar { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-dl-main {
      background: var(--success); color: #0d1117; border: none; border-radius: 6px;
      padding: 9px 18px; font-size: .875rem; font-weight: 600; cursor: pointer;
    }
    .btn-dl-main:hover { opacity: .84; }

    /* ── Fixed status bar ── */
    .statusbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 10px 24px 14px; z-index: 200;
      box-shadow: 0 -6px 24px rgba(0,0,0,.4);
      display: flex; flex-direction: column; gap: 8px;
    }
    .status-stages { display: flex; align-items: center; gap: 6px; font-size: .78rem; }
    .status-sep { color: var(--border); }
    .status-stage {
      padding: 2px 12px; border-radius: 10px; transition: all .25s;
    }
    .status-stage.done   { color: var(--success); }
    .status-stage.active { background: var(--accent); color: #0d1117; font-weight: 700; }
    .status-stage.wait   { color: var(--border); }
    .status-progress { display: flex; align-items: center; gap: 10px; }
    .status-track {
      flex: 1; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden;
    }
    .status-fill {
      height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s ease;
    }
    .status-pct  { font-size: .75rem; color: var(--text-muted); width: 34px; text-align: right; font-family: monospace; }
    .status-text { font-size: .78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Footer ── */
    .footer { text-align: center; padding: 22px; color: var(--text-muted); font-size: .75rem; border-top: 1px solid var(--border); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useCallback, useMemo, useEffect } = React;

    /* ─── pdf.js ─── */
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    /* ─── Constants ─── */
    const STAGES = [
      { key: 'load',    label: 'Laden'       },
      { key: 'render',  label: 'Rendern'     },
      { key: 'analyze', label: 'Analysieren' },
      { key: 'done',    label: 'Fertig'      },
    ];

    /* ─── Local conversion helpers ─── */

    const renderPageToPNG = async (page, scale = 1.5) => {
      const vp = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width  = vp.width;
      canvas.height = vp.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      return canvas.toDataURL('image/png');
    };

    /* Group text items into visual lines sorted top-to-bottom, left-to-right */
    const groupLines = (items, thresh = 3) => {
      const valid = items.filter(it => it.str?.trim());
      if (!valid.length) return [];
      const sorted = [...valid].sort((a, b) => {
        const dy = b.transform[5] - a.transform[5];
        return Math.abs(dy) > thresh ? dy : a.transform[4] - b.transform[4];
      });
      const lines = [];
      let cur = null;
      for (const it of sorted) {
        const y = it.transform[5];
        if (!cur || Math.abs(cur.y - y) > thresh) { cur = { y, items: [], maxH: 0 }; lines.push(cur); }
        cur.items.push(it);
        if (it.height > cur.maxH) cur.maxH = it.height;
      }
      return lines;
    };

    /* Convert grouped lines to Markdown, using global avgH for heading detection */
    const linesToMd = (lines, avgH, pageNum) => {
      let out = `<!-- page: ${pageNum} -->\n\n`;
      let para = [];
      const flush = () => {
        const t = para.join(' ').trim();
        if (t) { out += t + '\n\n'; para = []; }
      };
      for (const line of lines) {
        const text = line.items.map(it => it.str).join('').trim();
        if (!text) continue;
        const r        = avgH > 0 ? line.maxH / avgH : 1;
        const isBullet = /^[•‣◦⁃\-\*]\s+/.test(text);
        const isNum    = /^\d+[.)]\s+/.test(text);
        if      (r >= 1.65) { flush(); out += `# ${text}\n\n`; }
        else if (r >= 1.30) { flush(); out += `## ${text}\n\n`; }
        else if (r >= 1.10) { flush(); out += `### ${text}\n\n`; }
        else if (isBullet)  { flush(); out += `- ${text.replace(/^[•‣◦⁃\-\*]\s+/, '')}\n`; }
        else if (isNum)     { flush(); out += `${text}\n`; }
        else                { para.push(text); }
      }
      flush();
      return out;
    };

    /* Extract best-guess metadata from first page + full text */
    const guessMeta = (firstLines, fullText) => {
      const big = firstLines.reduce((m, l) => l.maxH > (m?.maxH ?? 0) ? l : m, null);
      const title = big ? big.items.map(it => it.str).join('').trim() : 'Nicht erkannt';
      const yearM = fullText.match(/\b(19[5-9]\d|20[0-3]\d)\b/);
      const doiM  = fullText.match(/\b(10\.\d{4,9}\/[^\s,.)>»"]{2,})/);
      return {
        title,
        year: yearM ? parseInt(yearM[0]) : new Date().getFullYear(),
        doi:  doiM  ? doiM[0].replace(/[,.)>»"]+$/, '') : 'nicht verfügbar',
      };
    };

    /* Sanitise filename (keep safe chars only) */
    const safeName = (s) => s.replace(/\.pdf$/i, '').replace(/[^a-zA-Z0-9_\-]/g, '_');

    /* ─── Download helpers ─── */
    const dlBlob = (content, name, mime) => {
      const url = URL.createObjectURL(new Blob([content], { type: mime }));
      Object.assign(document.createElement('a'), { href: url, download: name }).click();
      URL.revokeObjectURL(url);
    };
    const dlDataUrl = (dataUrl, name) =>
      Object.assign(document.createElement('a'), { href: dataUrl, download: name }).click();

    /* ─── App ─── */
    const App = () => {
      const [maxPages, setMaxPages]   = useState(30);
      const [file, setFile]           = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const [loading, setLoading]     = useState(false);
      const [stageIdx, setStageIdx]   = useState(0);
      const [step, setStep]           = useState('');
      const [progress, setProgress]   = useState(0);
      const [error, setError]         = useState('');
      const [markdown, setMarkdown]   = useState('');
      const [pageImages, setPageImages] = useState([]);
      const [activeTab, setActiveTab] = useState('preview');
      const [copied, setCopied]       = useState(false);
      const fileInputRef  = useRef(null);
      const abortRef      = useRef(null);
      const tabContentRef = useRef(null);

      const basename = useMemo(() => safeName(file?.name || 'dokument'), [file]);

      /* Figures = all rendered pages referenced in the markdown */
      const figures = useMemo(() => {
        if (!pageImages.length) return [];
        const escaped = basename.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(`figures\\/${escaped}-(\\d+)\\.png`, 'g');
        const refs = new Set();
        let m;
        while ((m = re.exec(markdown)) !== null) refs.add(parseInt(m[1]));
        const all = pageImages.map((d, i) => ({ name: `${basename}-${i + 1}.png`, pageNum: i + 1, dataUrl: d }));
        return refs.size > 0 ? all.filter(f => refs.has(f.pageNum)) : all;
      }, [markdown, pageImages, basename]);

      const acceptFile = useCallback((f) => {
        if (!f) return;
        if (f.type !== 'application/pdf') { setError('Bitte nur PDF-Dateien auswählen.'); return; }
        setFile(f); setMarkdown(''); setPageImages([]); setError('');
      }, []);

      const handleDrop = useCallback((e) => {
        e.preventDefault(); setIsDragging(false); acceptFile(e.dataTransfer.files[0]);
      }, [acceptFile]);

      const convert = async () => {
        if (!file) { setError('Bitte eine PDF-Datei auswählen.'); return; }

        setLoading(true); setError(''); setMarkdown(''); setPageImages([]);
        setProgress(0); setStageIdx(0);
        const ctrl = new AbortController();
        abortRef.current = ctrl;

        try {
          /* ── Stage 0: Load ── */
          setStep('PDF wird geladen…');
          const pdf   = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
          const total = pdf.numPages;
          const limit = Math.min(total, maxPages);
          const base  = safeName(file.name);

          /* ── Stage 1: Render + extract text (single pass per page) ── */
          setStageIdx(1);
          const images      = [];
          const allItems    = [];

          for (let i = 1; i <= limit; i++) {
            if (ctrl.signal.aborted) throw new DOMException('Aborted', 'AbortError');
            setStep(`Seite ${i} von ${limit}…`);
            setProgress(5 + Math.round((i / limit) * 65));

            const page = await pdf.getPage(i);
            /* Render PNG and extract text simultaneously */
            const [dataUrl, tc] = await Promise.all([
              renderPageToPNG(page),
              page.getTextContent({ normalizeWhitespace: true }),
            ]);
            images.push(dataUrl);
            allItems.push(tc.items);
          }
          setPageImages(images);

          if (total > limit) {
            setStep(`Nur die ersten ${limit} von ${total} Seiten werden verarbeitet.`);
            await new Promise(r => setTimeout(r, 900));
          }

          /* ── Stage 2: Build Markdown ── */
          setStageIdx(2);
          setStep('Markdown wird aufgebaut…');
          setProgress(72);

          /* Global average font size for consistent heading detection */
          const allH  = allItems.flat().filter(it => it.height > 1).map(it => it.height);
          const avgH  = allH.length ? allH.reduce((a, b) => a + b, 0) / allH.length : 12;
          const fullText = allItems.flat().map(it => it.str).join(' ');

          const meta = guessMeta(groupLines(allItems[0] ?? []), fullText);

          let md = `---\ntitle: "${meta.title.replace(/"/g, '\\"')}"\nauthors:\n  - "Nicht erkannt"\nyear: ${meta.year}\npublisher: "Nicht erkannt"\ndoi: "${meta.doi}"\n---\n\n`;

          let figNum = 0;
          for (let i = 0; i < allItems.length; i++) {
            md += linesToMd(groupLines(allItems[i]), avgH, i + 1);
            /* Pages with almost no text are likely figure/image pages */
            const pageText = allItems[i].map(it => it.str).join('').trim();
            if (pageText.length < 150) {
              figNum++;
              md += `![Figure ${figNum}: Seite ${i + 1}](figures/${base}-${i + 1}.png)\n\n`;
            }
            setProgress(72 + Math.round(((i + 1) / allItems.length) * 24));
          }

          setMarkdown(md);
          setProgress(100);
          setStageIdx(3);
          setStep('Konvertierung abgeschlossen.');
          await new Promise(r => setTimeout(r, 700));   // brief "Fertig" flash
          setActiveTab('preview');
          setStep('');

        } catch (err) {
          if (err.name === 'AbortError') {
            setError('Konvertierung abgebrochen.');
          } else {
            setError(`Fehler: ${err.message}`);
          }
          setStep('');
        } finally {
          setLoading(false);
          abortRef.current = null;
        }
      };

      const copyMarkdown = async () => {
        try { await navigator.clipboard.writeText(markdown); setCopied(true); setTimeout(() => setCopied(false), 2000); }
        catch (_) {}
      };

      const downloadZip = async () => {
        const zip    = new JSZip();
        zip.file(`${basename}.md`, markdown);
        if (figures.length > 0) {
          const folder = zip.folder('figures');
          figures.forEach(f => folder.file(f.name, f.dataUrl.split(',')[1], { base64: true }));
        }
        const blob = await zip.generateAsync({ type: 'blob' });
        const url  = URL.createObjectURL(blob);
        Object.assign(document.createElement('a'), { href: url, download: `${basename}.zip` }).click();
        URL.revokeObjectURL(url);
      };

      const previewHtml = useMemo(() => {
        if (!markdown) return null;
        try { return window.marked.parse(markdown); } catch (_) { return `<pre>${markdown}</pre>`; }
      }, [markdown]);

      return (
        <div className="app">
          <header className="header">
            <div className="header-inner">
              <h1>PDF → Markdown</h1>
              <p>Offline-Konvertierung direkt im Browser — kein API-Schlüssel nötig</p>
            </div>
          </header>

          <main className="main">

            {/* ── Config ── */}
            <div className="card">
              <label>Einstellungen</label>
              <div className="config-row">
                <div className="config-group">
                  <label>Max. Seiten</label>
                  <select value={maxPages} onChange={e => setMaxPages(Number(e.target.value))}>
                    <option value={10}>10 Seiten</option>
                    <option value={20}>20 Seiten</option>
                    <option value={30}>30 Seiten</option>
                    <option value={50}>50 Seiten</option>
                    <option value={100}>100 Seiten</option>
                    <option value={200}>200 Seiten</option>
                  </select>
                </div>
              </div>
              <p className="hint">
                Text wird direkt aus der PDF-Textebene extrahiert. Gescannte PDFs (reine Bilder) werden nicht transkribiert.
              </p>
            </div>

            {/* ── Dropzone ── */}
            <div
              className={`dropzone${isDragging ? ' dragging' : ''}${file ? ' has-file' : ''}`}
              onDragOver={e => { e.preventDefault(); setIsDragging(true); }}
              onDragLeave={() => setIsDragging(false)}
              onDrop={handleDrop}
              onClick={() => !loading && fileInputRef.current?.click()}
              role="button" tabIndex={0}
              onKeyDown={e => e.key === 'Enter' && fileInputRef.current?.click()}
            >
              <input ref={fileInputRef} type="file" accept=".pdf,application/pdf"
                onChange={e => acceptFile(e.target.files[0])} hidden />
              {file ? (
                <div className="file-info">
                  <span style={{ fontSize: '2rem' }}>📄</span>
                  <div>
                    <p className="file-name">{file.name}</p>
                    <p className="file-size">{(file.size / 1024 / 1024).toFixed(2)} MB</p>
                    <button className="file-change"
                      onClick={e => { e.stopPropagation(); fileInputRef.current?.click(); }}>
                      Andere Datei wählen
                    </button>
                  </div>
                </div>
              ) : (
                <div className="drop-prompt">
                  <span className="drop-icon">📂</span>
                  <p>PDF hier ablegen oder klicken zum Auswählen</p>
                  <small>Unterstützt bis zu {maxPages} Seiten</small>
                </div>
              )}
            </div>

            {/* ── Actions ── */}
            <div className="actions">
              <button className="btn-primary" onClick={convert} disabled={loading || !file}>
                {loading ? 'Wird konvertiert…' : 'In Markdown konvertieren'}
              </button>
              {loading && (
                <button className="btn-secondary" onClick={() => abortRef.current?.abort()}>
                  Abbrechen
                </button>
              )}
            </div>

            {/* ── Error ── */}
            {error && (
              <div className="error-card">
                <span>⚠️</span><span>{error}</span>
              </div>
            )}

            {/* ── Results ── */}
            {markdown && (
              <div className="results-section">
                <div className="tabs">
                  {[
                    { id: 'preview', label: 'Vorschau' },
                    { id: 'raw',     label: 'Rohtext' },
                    { id: 'figures', label: `Abbildungen (${figures.length})` },
                  ].map(({ id, label }) => (
                    <button key={id} className={`tab${activeTab === id ? ' active' : ''}`}
                      onClick={() => setActiveTab(id)}>
                      {label}
                    </button>
                  ))}
                </div>

                <div className="tab-content" ref={tabContentRef}>

                  {activeTab === 'preview' && (
                    <div className="md-preview"
                      dangerouslySetInnerHTML={{ __html: previewHtml || '' }} />
                  )}

                  {activeTab === 'raw' && (
                    <div>
                      <div className="raw-header">
                        <span className="raw-header-label">Markdown-Quelltext</span>
                        <button className={`btn-copy${copied ? ' copied' : ''}`} onClick={copyMarkdown}>
                          {copied ? '✓ Kopiert' : '⎘ Kopieren'}
                        </button>
                      </div>
                      <pre className="raw-md">{markdown}</pre>
                    </div>
                  )}

                  {activeTab === 'figures' && (
                    <div className="figures-wrap">
                      <div className="figures-notice">
                        💡 <strong>Hinweis:</strong> Lege die Abbildungen in einen{' '}
                        <code>figures/</code>-Unterordner neben der Markdown-Datei:
                        <br /><code>{basename}.md</code>
                        <br /><code>figures/{basename}-1.png</code>
                        <br /><code>figures/{basename}-2.png</code> …
                      </div>
                      {figures.length === 0 ? (
                        <p className="figures-empty">Keine referenzierten Abbildungen gefunden.</p>
                      ) : (
                        <div className="figures-grid">
                          {figures.map(fig => (
                            <div key={fig.name} className="figure-card">
                              <div className="figure-img-wrap">
                                <img src={fig.dataUrl} alt={fig.name} loading="lazy" />
                              </div>
                              <div className="figure-footer">
                                <span className="figure-name">{fig.name}</span>
                                <button className="btn-dl-sm"
                                  onClick={() => dlDataUrl(fig.dataUrl, fig.name)}>
                                  ↓ DL
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                </div>

                <div className="download-bar">
                  <button className="btn-dl-main"
                    onClick={() => dlBlob(markdown, `${basename}.md`, 'text/markdown;charset=utf-8')}>
                    ↓ Markdown (.md)
                  </button>
                  {figures.length > 0 && (
                    <button className="btn-dl-main"
                      onClick={() => figures.forEach(f => dlDataUrl(f.dataUrl, f.name))}>
                      ↓ Abbildungen ({figures.length}× PNG)
                    </button>
                  )}
                  <button className="btn-dl-main" onClick={downloadZip}>
                    ↓ Alles als ZIP
                  </button>
                </div>
              </div>
            )}

          </main>

          <footer className="footer">
            Vollständig offline · Keine Daten verlassen den Browser · pdf.js + marked.js + JSZip
          </footer>

          {/* ── Fixed status bar ── */}
          {loading && (
            <div className="statusbar">
              <div className="status-stages">
                {STAGES.map((s, i) => (
                  <React.Fragment key={s.key}>
                    {i > 0 && <span className="status-sep">›</span>}
                    <span className={
                      `status-stage ${i < stageIdx ? 'done' : i === stageIdx ? 'active' : 'wait'}`
                    }>
                      {i < stageIdx ? '✓ ' : ''}{s.label}
                    </span>
                  </React.Fragment>
                ))}
              </div>
              <div className="status-progress">
                <div className="status-track">
                  <div className="status-fill" style={{ width: `${progress}%` }} />
                </div>
                <span className="status-pct">{progress}%</span>
              </div>
              {step && <div className="status-text">{step}</div>}
            </div>
          )}

        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
